    <text x="40" y="294">salarié de Société Alpha (69001 Lyon) :</text>
    <text x="40" y="318">- Email : jean.dupont@example.org</text>
    <text x="40" y="338">- Tél : 01.42.56.78.90</text>
    <text x="40" y="358">- IBAN : FR76 3000 6000 0112 3456 7890 189</text>
    <text x="40" y="378">- NIR : 1 85 04 75 123 456 57</text>
  </g>
