  <!-- 3 étapes -->
  <rect x="24" y="78" width="292" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="36" y="91" width="20" height="20" rx="6" fill="#eef2ff"/><text x="42" y="105" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#4f46e5">1</text>
  <text x="66" y="99" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172033">Collez ou importez</text>
  <text x="66" y="114" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Email, Excel (.xlsx/.csv), code ou logs</text>

  <rect x="334" y="78" width="292" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
