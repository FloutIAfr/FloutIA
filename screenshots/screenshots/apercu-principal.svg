  <rect x="24" y="13" width="36" height="36" rx="10" fill="#4f46e5"/>
  <path d="M42 20l-7 3v5c0 4.5 7 8 7 8s7-3.5 7-8v-5l-7-3Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text x="72" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800" fill="#172033">Flout<tspan fill="#4f46e5">IA</tspan></text>
  <text x="72" y="49" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#64748b">Protégez vos données avant d'utiliser une IA</text>
  <rect x="735" y="18" width="200" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="752" cy="31" r="4" fill="#10b981"/>
