  <text x="376" y="99" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172033">Copiez ou téléchargez</text>
  <text x="376" y="114" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Envoyez la version protégée à votre IA</text>

  <rect x="644" y="78" width="292" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="656" y="91" width="20" height="20" rx="6" fill="#ecfdf5"/><text x="662" y="105" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#047857">3</text>
  <text x="686" y="99" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172033">Collez la réponse de l'IA</text>
  <text x="686" y="114" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Vos vraies données sont remises en place</text>

  <!-- Onglets -->
