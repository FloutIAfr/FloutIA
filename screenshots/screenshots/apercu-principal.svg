<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <rect width="960" height="470" rx="16" fill="#f6f7fb" stroke="#cbd5e1"/>
  <!-- Header -->
  <rect width="960" height="62" rx="16" fill="#ffffff"/>
