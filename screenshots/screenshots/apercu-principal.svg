  <rect x="490" y="180" width="446" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="490" y1="222" x2="936" y2="222" stroke="#e2e8f0"/>
  <rect x="506" y="191" width="20" height="20" rx="6" fill="#eef2ff"/><text x="512" y="205" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#4f46e5">2</text>
  <text x="534" y="206" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#172033">Copiez ce résultat protégé</text>
  <rect x="850" y="189" width="70" height="24" rx="7" fill="#4f46e5"/>
  <text x="866" y="205" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Copier</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#172033">
    <text x="506" y="250">Bonjour <tspan font-weight="700" fill="#4f46e5">[PERSONNE_1]</tspan>,</text>
    <text x="506" y="274">Concernant Monsieur <tspan font-weight="700" fill="#4f46e5">[PERSONNE_2]</tspan>,</text>
    <text x="506" y="294">salarié de <tspan font-weight="700" fill="#4f46e5">[ENTREPRISE_1]</tspan> (<tspan font-weight="700" fill="#4f46e5">[ADRESSE_1]</tspan>) :</text>
    <text x="506" y="318">- Email : <tspan font-weight="700" fill="#4f46e5">[EMAIL_1]</tspan></text>
    <text x="506" y="338">- Tél : <tspan font-weight="700" fill="#4f46e5">[TELEPHONE_1]</tspan></text>
    <text x="506" y="358">- IBAN : <tspan font-weight="700" fill="#4f46e5">[IBAN_1]</tspan></text>
    <text x="506" y="378">- NIR : <tspan font-weight="700" fill="#4f46e5">[NIR_1]</tspan></text>
  </g>
  <line x1="490" y1="398" x2="936" y2="398" stroke="#e2e8f0"/>
  <text x="506" y="426" font-family="system-ui,sans-serif" font-size="11" fill="#047857">✓ 8 informations masquées • relisez avant d'envoyer</text>
